name: STNG Development CI/CD

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stng-development
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'

  SOLUTION: 'STNG.slnx'

  API_PROJECT: 'src/STNG.HttpApi.Host/STNG.HttpApi.Host.csproj'

  DB_MIGRATOR_PROJECT: 'src/STNG.DbMigrator/STNG.DbMigrator.csproj'

  DEV_SITE_PATH: 'C:\MySites\STNG'

  DEV_BACKUP_PATH: 'C:\Deploy\STNG\Backups'

  DEV_HEALTH_URL: 'https://localhost:44391/health-status'

jobs:

  # ==========================================================
  # CI
  # ==========================================================
  ci:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }

      - name: Build
        shell: pwsh
        run: |
          dotnet build `
            $env:SOLUTION `
            --configuration Release `
            --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Test
        shell: pwsh
        run: |
          dotnet test `
            $env:SOLUTION `
            --configuration Release `
            --no-build `
            --no-restore `
            --verbosity normal
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }

      # Install the ABP CLI and the client-side libraries required
      # by the Basic Theme before publishing the API.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install ABP client libraries
        shell: pwsh
        working-directory: src/STNG.HttpApi.Host
        run: |
          npm install --global yarn@1.22.22
          if ($LASTEXITCODE -ne 0) { throw 'Yarn installation failed.' }

          dotnet tool install --global Volo.Abp.Studio.Cli --version 3.1.3
          if ($LASTEXITCODE -ne 0) { throw 'ABP CLI installation failed.' }

          $abpCli = Join-Path $env:USERPROFILE '.dotnet\tools\abp.exe'
          if (-not (Test-Path -LiteralPath $abpCli)) {
            throw "ABP CLI executable not found: $abpCli"
          }

          & $abpCli install-libs
          if ($LASTEXITCODE -ne 0) { throw 'abp install-libs failed.' }

          $libsPath = Join-Path (Get-Location) 'wwwroot\libs'
          if (-not (Test-Path -LiteralPath $libsPath -PathType Container)) {
            throw "ABP libraries directory is missing: $libsPath"
          }

          $sample = Get-ChildItem -LiteralPath $libsPath -File -Recurse | Select-Object -First 1
          if (-not $sample) {
            throw 'ABP libraries directory is empty.'
          }

          Write-Host 'ABP client libraries installed successfully.'

      - name: Publish API
        shell: pwsh
        run: |
          dotnet publish `
            $env:API_PROJECT `
            --configuration Release `
            --no-restore `
            --output ./artifacts/api
          if ($LASTEXITCODE -ne 0) { throw 'API publish failed.' }

      # Validate the actual publish output that CD downloads.
      - name: Verify API publish contents
        shell: pwsh
        run: |
          $apiPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts\api'
          $hostDll = Join-Path $apiPath 'STNG.HttpApi.Host.dll'
          $libsPath = Join-Path $apiPath 'wwwroot\libs'

          if (-not (Test-Path -LiteralPath $hostDll -PathType Leaf)) {
            throw "Published API DLL is missing: $hostDll"
          }
          if (-not (Test-Path -LiteralPath $libsPath -PathType Container)) {
            throw "Published ABP libraries directory is missing: $libsPath"
          }
          if (-not (Get-ChildItem -LiteralPath $libsPath -File -Recurse | Select-Object -First 1)) {
            throw 'Published ABP libraries directory is empty.'
          }
          if (Test-Path -LiteralPath (Join-Path $apiPath 'openiddict.pfx')) {
            throw 'Refusing to upload OpenIddict private certificate in the deployment artifact.'
          }

          Write-Host 'Published API DLL and ABP libraries verified.'

      - name: Publish DbMigrator
        shell: pwsh
        run: |
          dotnet publish `
            $env:DB_MIGRATOR_PROJECT `
            --configuration Release `
            --no-restore `
            --output ./artifacts/dbmigrator
          if ($LASTEXITCODE -ne 0) { throw 'DbMigrator publish failed.' }

      - name: Add deployment script
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path './artifacts/deploy' |
            Out-Null

          Copy-Item `
            '.github/scripts/deploy-stng.ps1' `
            './artifacts/deploy/deploy-stng.ps1' `
            -ErrorAction Stop

      - name: Upload development artifact
        uses: actions/upload-artifact@v7
        with:
          name: stng-development-${{ github.sha }}
          path: ./artifacts
          if-no-files-found: error
          retention-days: 7

  # ==========================================================
  # CD
  # ==========================================================
  deploy:
    name: Deploy Development
    needs:
      - ci

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    runs-on:
      - self-hosted
      - Windows
      - X64
      - stng-dev

    environment:
      name: development

    steps:
      - name: Download development artifact
        uses: actions/download-artifact@v8
        with:
          name: stng-development-${{ github.sha }}
          path: package

      - name: Run STNG DbMigrator
        shell: powershell
        env:
          DOTNET_ENVIRONMENT: Production
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__Default: ${{ secrets.STNG_DEV_CONNECTION_STRING }}
        run: |
          $migratorPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            'package\dbmigrator'

          $migratorDll = Join-Path `
            $migratorPath `
            'STNG.DbMigrator.dll'

          if (-not (Test-Path $migratorDll)) {
            throw "DbMigrator was not found: $migratorDll"
          }

          Write-Host 'Running STNG database migrations...'
          Push-Location $migratorPath
          try {
            dotnet .\STNG.DbMigrator.dll
            if ($LASTEXITCODE -ne 0) {
              throw "STNG DbMigrator failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Pop-Location
          }

          Write-Host 'STNG database migration completed successfully.'

      - name: Deploy to development IIS
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\package\deploy\deploy-stng.ps1" `
            -SourcePath "$env:GITHUB_WORKSPACE\package\api" `
            -SitePath "${{ env.DEV_SITE_PATH }}" `
            -BackupPath "${{ env.DEV_BACKUP_PATH }}" `
            -HealthUrl "${{ env.DEV_HEALTH_URL }}"
